services:
  - type: web
    name: zno-supercapacitor-api
    env: python
    # Render starts uvicorn from the backend/ directory
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Render free tier: 512 MB RAM — exclude RF (211 MB compressed, 644 MB uncompressed)
    # Use Tier-1: lightgbm (1.7 MB), gru (0.34 MB) + Tier-2: xgboost, ann, lstm
    # To enable RF on paid plans, add "rf" to ENABLED_MODELS below.
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DOCS_ENABLED
        value: "true"
      - key: ENABLE_WARMUP
        value: "true"
      - key: PREDICTION_CACHE_SIZE
        value: "128"
      # Models enabled in production (RF excluded — 211 MB compressed, ~640 MB RAM peak)
      # Add "rf" back if deploying to a plan with 2+ GB RAM
      - key: ENABLED_MODELS
        value: '["lightgbm","gru","xgboost","ann","lstm"]'
      # CORS: replace with your actual Vercel frontend domain
      # Multiple origins: '["https://your-app.vercel.app","https://custom-domain.com"]'
      - key: ALLOWED_ORIGINS
        sync: false   # set in Render dashboard — keeps domain out of version control
